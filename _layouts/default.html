<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  {%- comment -%}
    `body_class` lets a page opt into a wider content wrapper (see releases.scss).
    Empty for every other page, which keeps the default 900px wrapper.
  {%- endcomment -%}
  <body{% if page.body_class %} class="{{ page.body_class | escape }}"{% endif %}>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

  </body>

</html>
